name: CI

on:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Building on Linux also catches a package-lock.json that is missing
      # Linux versions of native packages (e.g. lightningcss, Tailwind's oxide).
      - name: Build
        run: npm run build
